# Renders SeaWise's radar frames — measured every ten minutes, forecast hourly.
#
# This file belongs in a SEPARATE PUBLIC repository, not in the app repo.
# Two reasons, both practical:
#
#   - Actions minutes. Private repos get 2,000 free minutes a month; a
#     ten-minute job would eat that in days. Public repos get unlimited.
#   - GitHub Pages. Free Pages hosting only serves public repos, and Pages is
#     what puts the frames behind a CDN at no cost.
#
# Nothing private is exposed by making it public. It is a script that reads
# public-domain NOAA data and writes weather pictures. No app source, no keys.
#
# ONE workflow, not two, and that is not a tidiness choice. A Pages deploy
# replaces the whole site, so a separate measured job and forecast job would
# each publish a site missing the other's frames — whichever finished last
# would win and the other half of the timeline would vanish until its next
# run. Everything is rendered into one `public/` directory and deployed
# together.
#
# `public/` is CARRIED IN THE ACTIONS CACHE, not committed. It used to be
# committed, which is how the run kept its state between ticks — and it grew
# the repository by every byte it ever published. Eight commits of frames had
# already made `.git` 452 MB, and cutting the forecast half into regional
# cells raised a run from 9 MB to 37 MB: roughly 880 MB of new objects a day,
# which reaches GitHub's limits in under a week and never comes back down,
# because git keeps every version of a file that changes every hour.
#
# The cache holds exactly the state the run needs and nothing historical. If
# it is ever evicted the job simply re-renders, which is what it already does
# for a missing frame — so the failure mode is one slower run, not a broken
# site. Nothing here is source: the scripts live in git, the pictures do not.
#
# Setup is in ../README.md.
name: SeaWise radar

on:
  schedule:
    # Every ten minutes, matching the measured timeline's own step. MRMS
    # publishes a frame every two minutes; there is no point pulling faster
    # than the app can show.
    - cron: "*/10 * * * *"
  workflow_dispatch:

# One at a time. Two overlapping runs would race to commit the same frames.
#
# Two jobs and two deploys since 2026-09-02 (B-20). The measured frames and the
# projection are rendered and published first, a few minutes into the run; the
# forecast, wind and cloud follow from the same files and publish again. Before
# this the measured frames waited for everything else and went live ~15 minutes
# old, so for a third to half of every cycle the app rightly refused them as
# past 30 minutes and drew NOAA's tiles instead. The second job starts from the
# first job's files, not from the live site, so it can never republish older
# measured frames over fresher ones; and its deploy waits for the first.
concurrency:
  group: helmcast-radar
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  measured:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # The frames from the last run. The key rolls every run so each one
      # saves a fresh entry, and `restore-keys` picks up the newest previous
      # one — a fixed key would be written once and never updated again.
      # GitHub evicts these least-recently-used against its own 10 GB
      # allowance, so the history bounds itself instead of accumulating.
      - name: Restore the published frames
        uses: actions/cache/restore@v4
        with:
          path: public
          key: helmcast-radar-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: helmcast-radar-

      # Measured radar, every run. Cheap: one or two new frames per run,
      # about 1.5 MB in and 400 KB out each.
      - name: Unit tests for the renderer maths
        run: python -m unittest test_cells test_nowcast test_render test_steps

      - name: Render measured frames
        run: python observed.py --out public/observed

      # Extrapolated measured radar for the next two hours (D-64). A layer,
      # not the screen, so it must not take the run down.
      - name: Render the nowcast from the last two measured frames
        continue-on-error: true
        run: python nowcast.py --out public/nowcast

      # Observed lightning, every run. NOAA's GLM buckets publish a file every
      # 20 seconds, and the script carries forward what it published last time
      # so a ten-minute tick downloads ten minutes of files rather than the
      # whole thirty-minute window three times over — the same reuse the radar
      # frames already get.
      #
      # It writes into the same `public/` as the radar, and is deliberately in
      # THIS workflow rather than its own. A Pages deploy replaces the whole
      # site: a separate lightning job would publish a site with no radar in
      # it, and the radar job would then publish one with no lightning, each
      # wiping the other every few minutes.
      #
      # A failure here must not take the radar down with it. Lightning is one
      # layer; the frames are the screen.
      - name: Render observed lightning
        continue-on-error: true
        run: python lightning.py --minutes 30 --out public/lightning

      - name: Prune measured and projected frames the timeline can no longer reach
        run: |
          python prune.py --dir public/observed
          python prune.py --dir public/nowcast

      # Carried forward twice a run: here, so a failed forecast job still
      # leaves the next run a fresh measured set to restore; and again after
      # the forecast. `restore-keys` picks the newest, whichever that is.
      - name: Carry the frames to the next run (measured)
        uses: actions/cache/save@v4
        with:
          path: public
          key: helmcast-radar-${{ github.run_id }}-${{ github.run_attempt }}-measured

      # Handed to the forecast job as files, never re-read from the live site:
      # Pages takes a moment to serve a new deploy, and a job that restored
      # the previous site would republish older measured frames over these.
      - name: Hand the files to the forecast job
        uses: actions/upload-artifact@v4
        with:
          name: public-after-measured
          path: public
          retention-days: 1
          if-no-files-found: error

      - name: Publish the measured half
        uses: actions/upload-pages-artifact@v3
        with:
          name: pages-measured
          path: public

  deploy-measured:
    needs: measured
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-measured

  forecast:
    needs: measured
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Take the files from the measured job
        uses: actions/download-artifact@v4
        with:
          name: public-after-measured
          path: public

      - name: Render forecast frames if the run has moved on
        id: forecast
        run: |
          if python - <<'EOF'
          import datetime, json, os, sys
          sys.path.insert(0, ".")
          import cells as layout
          path = "public/manifest.json"
          if not os.path.exists(path):
              sys.exit(0)                      # nothing published yet: render
          published = json.load(open(path))
          # A changed cell list must re-render, whatever the age says.
          #
          # Without this the layout only reached the site when the age gate
          # happened to fire, so adding cells for the deep Gulf and the inland
          # lakes published nothing for over an hour and looked like a broken
          # workflow. The manifest should describe the code, and this is what
          # makes that true rather than eventually true.
          want = {n for n, _, _ in layout.FORECAST_CELL_ORIGINS} | {layout.NATIONAL_ID}
          if {c["id"] for c in published.get("cells", [])} != want:
              print("cell layout changed; re-rendering")
              sys.exit(0)
          # The colour rule is part of the picture too. Without this a ramp
          # change published nothing until the run aged out, and every frame
          # in between was drawn to the old rule while the code said the new.
          import render
          if published.get("rampSteps") != render.RAMP_STEPS:
              print("ramp changed; re-rendering")
              sys.exit(0)
          if published.get("quantiser") != render.QUANTISER:
              print("quantiser changed; re-rendering")
              sys.exit(0)
          if published.get("palette") != render.PALETTE:
              print("palette changed; re-rendering")
              sys.exit(0)
          if published.get("smoothing") != render.SMOOTH_CELLS:
              print("smoothing changed; re-rendering")
              sys.exit(0)
          if published.get("alpha") != render.ALPHA:
              print("opacity changed; re-rendering")
              sys.exit(0)
          run = published["runTime"].replace("Z", "+00:00")
          age = datetime.datetime.now(datetime.timezone.utc) - datetime.datetime.fromisoformat(run)
          sys.exit(0 if age.total_seconds() > 5400 else 1)
          EOF
          then
            python render.py --out public
            # Announced rather than inferred. The step succeeds either way —
            # it is an if/then/else in shell — so `outcome == success` is true
            # even when nothing was rendered, and gating wind on that would
            # have pulled 35 MB every ten minutes to republish identical files.
            echo "rendered=true" >> "$GITHUB_OUTPUT"
          else
            echo "forecast manifest is current; skipping"
            echo "rendered=false" >> "$GITHUB_OUTPUT"
          fi

      # Wind vectors, only when the forecast frames were re-rendered — both
      # come from the same HRRR run, so re-pulling wind on a tick that skipped
      # the forecast would download 35 MB to republish identical files.
      #
      # continue-on-error for the same reason as lightning: wind is one layer,
      # the radar frames are the screen.
      - name: Render wind vectors with the forecast
        if: steps.forecast.outputs.rendered == 'true'
        continue-on-error: true
        run: python wind.py --out public/wind

      # Cloud cover, on the same gate and for the same reason as wind: it
      # comes from the run the forecast frames came from.
      - name: Render cloud cover with the forecast
        if: steps.forecast.outputs.rendered == 'true'
        continue-on-error: true
        run: python cloud.py --out public/cloud

      - name: Prune forecast frames the timeline can no longer reach
        run: python prune.py --dir public

      - name: Carry the frames to the next run
        uses: actions/cache/save@v4
        with:
          path: public
          key: helmcast-radar-${{ github.run_id }}-${{ github.run_attempt }}-full

      - name: Publish everything
        uses: actions/upload-pages-artifact@v3
        with:
          name: pages-full
          path: public

  deploy-full:
    # After the measured deploy, never before it: this site is a superset of
    # that one, and Pages serves whichever deploy landed last.
    needs: [forecast, deploy-measured]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-full

  # The same two sites copied into Cloudflare R2 behind radar.seawiseweather.com
  # (SeaWise D-199), which the app reads from 1.1. GitHub Pages stays the host
  # for every build that reads it, so these jobs are kept apart from it: each
  # starts only after its Pages artifact exists, neither is ever needed by a
  # deploy, and a failure in either leaves the run green (continue-on-error) with
  # an error line in its summary. Each publishes exactly what its Pages deploy
  # publishes, by unpacking the same artifact. publish_r2.py holds the order:
  # frames, then manifests, then deletes, stopping at the first failure. One
  # cost remains: runs go one at a time, so the next run starts after these
  # finish. Normally that is under a minute after deploy-full; with R2 slow or
  # down the script's deadline and these timeouts hold it to a few minutes.
  r2-measured:
    needs: measured
    runs-on: ubuntu-latest
    # Short on purpose: the next run waits for this one (publish_r2.py, top).
    timeout-minutes: 4
    continue-on-error: true
    # Reads its own repo and this run's artifacts; never Pages or the OIDC token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-r2.txt

      - name: Install
        run: pip install -r requirements-r2.txt

      - name: Unit tests for the R2 publisher
        run: python -m unittest test_publish_r2

      - name: Take the measured half as Pages got it
        uses: actions/download-artifact@v4
        with:
          name: pages-measured
          path: artifact

      - name: Unpack it
        run: mkdir site && tar -xf artifact/artifact.tar -C site

      - name: Publish the measured half to R2
        # The write keys reach this step alone, not checkout, pip or the tests.
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python publish_r2.py --dir site

  r2-full:
    # After the measured copy, never before it, as deploy-full follows
    # deploy-measured: this site is a superset of that one. It still runs when
    # the measured copy failed, so one bad publish is mended by the next.
    needs: [forecast, r2-measured]
    if: ${{ !cancelled() && needs.forecast.result == 'success' }}
    runs-on: ubuntu-latest
    # Short on purpose: the next run waits for this one (publish_r2.py, top).
    timeout-minutes: 4
    continue-on-error: true
    # Reads its own repo and this run's artifacts; never Pages or the OIDC token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-r2.txt

      - name: Install
        run: pip install -r requirements-r2.txt

      - name: Take everything as Pages got it
        uses: actions/download-artifact@v4
        with:
          name: pages-full
          path: artifact

      - name: Unpack it
        run: mkdir site && tar -xf artifact/artifact.tar -C site

      - name: Publish everything to R2
        # The write keys reach this step alone, not checkout, pip or the tests.
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python publish_r2.py --dir site
